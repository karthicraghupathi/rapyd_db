name: test

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest tests/unit -v --cov=rapyd_db --cov-branch --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy rapyd_db
      - run: uv run --locked pre-commit run --all-files

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rapyd
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -prapyd"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: rapyd
          MONGO_INITDB_ROOT_PASSWORD: rapyd
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet -u rapyd -p rapyd --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Rapyd_Pass1!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 10s --health-retries 20 --health-start-period 45s
    env:
      RUN_INTEGRATION_TESTS: "1"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rapyd
      MYSQL_TEST_DB: rapyd_test
      MSSQL_HOST: 127.0.0.1
      MSSQL_PORT: "1433"
      MSSQL_USER: sa
      MSSQL_PASSWORD: "Rapyd_Pass1!"
      MSSQL_TEST_DB: rapyd_test
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: "27017"
      MONGO_USERNAME: rapyd
      MONGO_PASSWORD: rapyd
      MONGO_TEST_DB: rapyd_test
      MONGO_TEST_COLLECTION: salaries
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: uv sync --locked --extra dev --extra mysql --extra mssql --extra mongo
      - run: uv run --locked pytest tests/integration -v

  packaging:
    runs-on: ubuntu-latest
    needs: [unit, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run --locked python -m build
      - run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install dist/*.whl
          /tmp/probe/bin/python -c "import rapyd_db; from rapyd_db.backends import AbstractBackend; print('ok')"
