[project]
name = "rapyd_db"
version = "0.0.9"
description = "An opinionated lightweight wrapper around various DB backend drivers."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Karthic Raghupathi", email = "karthicr@gmail.com" }]
requires-python = ">=3.9"
keywords = ["database", "mysql", "mariadb", "mssql", "mongodb", "wrapper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/karthicraghupathi/rapyd_db"
Issues = "https://github.com/karthicraghupathi/rapyd_db/issues"
Changelog = "https://github.com/karthicraghupathi/rapyd_db/blob/master/CHANGELOG.md"

[project.optional-dependencies]
mysql = ["mysqlclient>=2.2"]
mssql = ["pymssql>=2.3"]
mongo = ["pymongo>=4.6"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "coverage[toml]>=7.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "tox>=4.18",
    "build>=1.2",
    "twine>=5.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rapyd_db"]

[tool.hatch.build.targets.sdist]
include = ["rapyd_db", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a running DB (skipped unless RUN_INTEGRATION_TESTS=1)",
]

[tool.coverage.run]
branch = true
source = ["rapyd_db"]
omit = ["rapyd_db/tests/*", "tests/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle/pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "PT",               # pytest-style
    "C4",               # comprehensions
    "TID",              # tidy-imports
]
ignore = [
    "E501",  # long lines — formatter handles
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]   # allow assert False

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true   # MySQLdb / pymssql / pymongo lack stubs
files = ["rapyd_db"]
