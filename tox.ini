[tox]
requires = tox>=4
env_list = py{39,310,311,312,313}, lint, type

[testenv]
deps =
    pytest>=8
    pytest-cov>=5
    pytest-mock>=3.14
commands = pytest tests/unit {posargs}

[testenv:lint]
skip_install = true
deps = ruff>=0.6
commands =
    ruff check .
    ruff format --check .

[testenv:type]
deps = mypy>=1.11
commands = mypy rapyd_db
